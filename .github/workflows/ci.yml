name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run of the slow suite (real-data reproducers + determinism).
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (default, excludes slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      # Default addopts apply: -m "not slow" excludes the slow tests and
      # --cov-fail-under=85 enforces the coverage floor on the fast run.
      - name: Test
        run: python -m pytest tests/ -q

  slow:
    # Slow tests (SABR->SVI mapping reproducers, eSSVI determinism
    # subprocess tests) are real-data reproducers that burn thousands of
    # optimizer evals; they run nightly on a schedule and on demand via
    # workflow_dispatch so they do not block every push.
    name: slow (nightly, -m slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      # --no-cov: the 85% floor is meaningless on the slow subset.
      - name: Test
        run: python -m pytest tests/ -q -m slow --no-cov
