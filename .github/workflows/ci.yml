name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run of the slow suite (real-data reproducers + determinism).
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (${{ matrix.python-version }}, excludes slow)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      # Default addopts apply: -m "not slow" excludes the slow tests and
      # --cov-fail-under=85 enforces the coverage floor on the fast run.
      - name: Test
        run: python -m pytest tests/ -q

  lint:
    # Ruff enforces the rule set pinned in pyproject ([tool.ruff.lint]).
    # basedpyright is a ratchet: .basedpyright/baseline.json records the
    # pre-existing findings, so any NEW type error fails this job even
    # though the baseline is not yet at zero.
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .
          # pytest must be importable for the type ratchet to resolve
          # test-file imports against its baseline.
          python -m pip install ruff==0.16.6 basedpyright==1.39.10 pytest
      - name: Ruff
        run: python -m ruff check .
      - name: basedpyright (baseline ratchet)
        run: python -m basedpyright

  slow:
    # Slow tests (SABR->SVI mapping reproducers, eSSVI determinism
    # subprocess tests) are real-data reproducers that burn thousands of
    # optimizer evals; they run nightly on a schedule and on demand via
    # workflow_dispatch so they do not block every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: slow (nightly, -m slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      # --no-cov: the 85% floor is meaningless on the slow subset.
      - name: Test
        run: python -m pytest tests/ -q -m slow --no-cov
