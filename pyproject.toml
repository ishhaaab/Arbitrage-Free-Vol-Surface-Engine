[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbfree-vol-surface"
version = "0.2.0"
description = "Raw SVI and sequentially constrained SSVI calibration with domain-limited numerical verification"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ishhaab", email = "ishaan2702@gmail.com" }]
keywords = ["implied-volatility", "volatility-surface", "svi", "ssvi", "options"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pydantic>=2,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "basedpyright>=1.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow' --cov=arbfree_vol --cov-fail-under=70 --cov-report=term-missing"
markers = ["slow: deterministic frozen-snapshot integration tests"]

[tool.pyright]
include = ["src", "tests", "demo"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"bench/*.py" = ["E402"]
"demo/*.py" = ["E402"]

[tool.coverage.run]
omit = ["src/arbfree_vol/plots.py"]
