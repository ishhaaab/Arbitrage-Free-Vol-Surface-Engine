[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbfree-vol-surface"
version = "0.1.0"
description = "Arbitrage-free implied-volatility surfaces: hard-constrained eSSVI/SVI/SABR calibration, arbitrage detection & repair, Greeks, Dupire local vol"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ishhaab", email = "ishaan2702@gmail.com" }]
keywords = [
  "implied-volatility",
  "volatility-surface",
  "svi",
  "essvi",
  "sabr",
  "dupire",
  "options",
  "quantitative-finance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pydantic",
  "pyyaml",
  "matplotlib",
  "yfinance",
]

# Optional ingestion source; imported lazily (ingestion/openbb.py) so the
# base install stays light.
[project.optional-dependencies]
openbb = ["openbb"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[project.scripts]
arbfree = "arbfree_vol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Default run excludes the slow marker so `pytest tests/` stays fast and
# still enforces the 85% coverage floor. Run `pytest -m slow` for only the
# slow tests (real-data reproducers, subprocess determinism) or
# `pytest -m ""` to run everything.
addopts = "-m 'not slow' --cov=arbfree_vol --cov-fail-under=85 --cov-report=term-missing"
markers = [
  "slow: long-running tests (real-data reproducers, subprocess determinism) — excluded from the default run; run with -m slow",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingTypeStubs = false
