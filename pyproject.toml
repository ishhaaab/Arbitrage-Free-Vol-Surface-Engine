[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbfree-vol-surface"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "pydantic",
  "matplotlib",
  "yfinance",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Default run excludes the slow marker so `pytest tests/` stays fast and
# still enforces the 85% coverage floor. Run `pytest -m slow` for only the
# slow tests (real-data reproducers, subprocess determinism) or
# `pytest -m ""` to run everything.
addopts = "-m 'not slow' --cov=arbfree_vol --cov-fail-under=85 --cov-report=term-missing"
markers = [
  "slow: long-running tests (real-data reproducers, subprocess determinism) — excluded from the default run; run with -m slow",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingTypeStubs = false
